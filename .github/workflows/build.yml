name: Build and Validate

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# A newer push to the same pull request makes the older run pointless:
# cancel it instead of letting runs pile up in the queue. Runs on main and
# on tags are never cancelled - every commit that lands gets its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag matches package.json version ($PKG_VERSION)."

  # A release pushes main and then the tag, both pointing at the same
  # commit: the push to main already builds it, so the tag run only checks
  # that the tag matches package.json instead of building everything twice.
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      # One platform failing (or never getting a runner) must not cancel
      # the other and hide its result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Vitra ships with zero runtime dependencies, so the blocking gate
    # audits what a consumer actually installs. The full audit (dev
    # tooling included) still runs and prints on every build, but an
    # advisory with no patched release in a lint/build tool must not
    # stop the pipeline before lint, build and tests have even run.
    - name: Audit shipped dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Audit dev tooling (report only)
      continue-on-error: true
      run: npm audit --audit-level=high

    - name: Run Lint
      run: npm run lint

    - name: Run Build
      run: npm run build

    - name: Run Tests
      run: npm test

    - name: Check Bundle Size
      run: npm run size

    - name: Verify Build Artifacts
      shell: bash
      run: |
        if [ ! -f dist/vitra.min.css ]; then
          echo "Build failed: dist/vitra.min.css not found!"
          exit 1
        fi
        if [ ! -f dist/vitra.min.js ]; then
          echo "Build failed: dist/vitra.min.js not found!"
          exit 1
        fi
        echo "Build succeeded."
