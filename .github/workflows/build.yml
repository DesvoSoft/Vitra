name: Build and Validate

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-tag-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag matches package.json version ($PKG_VERSION)."

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Vitra ships with zero runtime dependencies, so the blocking gate
    # audits what a consumer actually installs. The full audit (dev
    # tooling included) still runs and prints on every build, but an
    # advisory with no patched release in a lint/build tool must not
    # stop the pipeline before lint, build and tests have even run.
    - name: Audit shipped dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Audit dev tooling (report only)
      continue-on-error: true
      run: npm audit --audit-level=high

    - name: Run Lint
      run: npm run lint

    - name: Run Build
      run: npm run build

    - name: Run Tests
      run: npm test

    - name: Check Bundle Size
      run: npm run size

    - name: Verify Build Artifacts
      shell: bash
      run: |
        if [ ! -f dist/vitra.min.css ]; then
          echo "Build failed: dist/vitra.min.css not found!"
          exit 1
        fi
        if [ ! -f dist/vitra.min.js ]; then
          echo "Build failed: dist/vitra.min.js not found!"
          exit 1
        fi
        echo "Build succeeded."
